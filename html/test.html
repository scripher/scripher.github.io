<!DOCTYPE html>

<html>
  <head>
    <meta name = "referrer" content = "no-referrer">
    <meta charset = "UTF-8">
    <title>Many Tests</title>
    <link rel = "stylesheet" type = "text/css" href = "https://scripher.github.io/css/home_button.css">
    <style>
      img {
        margin: 10px;
      }
      
      .box {
        width: 200px;
        height: 200px;
        background-color: #000000;
        border: 2px solid #000000;
        margin: 20px;
      }

      .num_box {
        width: 50px;
        height: 50px;
        background-color: #17B1A6;
        margin: 10px;

        font-family: "Arial Black", Arial, sans-serif;
        font-size: 25px;
        font-weight: bold;
        text-align: center;
        line-height: 50px;
      }

      .box_group {
        display: flex;
        flex-wrap: nowrap;
      }

      .move_btn {
        width: 50px;
        height: 50px;
      }
      
      .move_btn:hover {
        transform: translateY(-5px);
      }
    </style>
  </head>
  <body>
    <!-- 百度图片 -->
    <img height = "150px" src = "https://img1.baidu.com/it/u=1136883497,249397442&fm=253&app=138&f=JPEG?w=800&h=1067">
    <!-- b站专栏 -->
    <img height = "150px" src = "https://i0.hdslb.com/bfs/article/e3cdb2b3ab299a6de8ec1cd6b09c25e12024069799.jpg">
    <img height = "150px" src = "https://i0.hdslb.com/bfs/new_dyn/a55a2722afd0bf71faf96f88312f040997182109.png">
    <!-- 知乎公开回答 -->
    <img height = "150px" src = "https://pica.zhimg.com/v2-d563d8d48b533bb5b38b377d1e64a128_1440w.jpg">
    <!-- CSDN草稿 -->
    <img height = "150px" src = "https://i-blog.csdnimg.cn/direct/dda8865fd60649a5805daa8c7b44e590.jpeg">

    <!-- 按按钮改变文本 -->
    <hr />
    <p>
      这是三个按钮：
      <button id = "like">点赞</button>
      <button id = "coin">投币</button>
      <button id = "fav">收藏</button>
    </p>
    <p id = "val_data">点赞: 0, 投币: 0, 收藏: 0</p>

    <!-- 按按钮改变颜色 -->
    <hr />
    <div id = "color_box" class = "box"></div>
    <p>R: <input id = "input_r" type = "number" value = "0"></p>
    <p>G: <input id = "input_g" type = "number" value = "0"></p>
    <p>B: <input id = "input_b" type = "number" value = "0"></p>
    <button id = "color_btn">Change Color</button>

    <!-- 按div改变颜色 -->
    <hr />
    <div class = "box_group">
      <div id = "box_1" class = "box"></div>
      <div id = "box_2" class = "box"></div>
      <div id = "box_3" class = "box"></div>
    </div>

    <!-- 生成随机数 -->
    <hr />
    <p id = "per_text">排列: </p>
    <div id = "nine_boxes" class = "box_group">
      <div class = "num_box"></div>
      <div class = "num_box"></div>
      <div class = "num_box"></div>
      <div class = "num_box"></div>
      <div class = "num_box"></div>
      <div class = "num_box"></div>
      <div class = "num_box"></div>
      <div class = "num_box"></div>
      <div class = "num_box"></div>
    </div>
    <input id = "ord2per_num" type = "number">
    <button id = "ord2per_btn">Get Permutation</button>
    <button id = "rnd_per">Random Permutation</button>

    <!-- 动态按钮 -->
    <hr />
    <p>可动按钮: <button class = "move_btn">I can Move</button></p>

  <script type = "module" src = "https://scripher.github.io/js/home_button.js"></script>
  <script src = "https://scripher.github.io/js/cantor_expansion.js"></script>
  <script>
    // 三连部分
    let vlike = 0, vcoin = 0, vfav = 0;
    let p_content = document.getElementById("val_data");
    let like_btn = document.getElementById("like");
    let coin_btn = document.getElementById("coin");
    let fav_btn = document.getElementById("fav");
    like_btn.addEventListener("click", function() {
      vlike++;
      p_content.innerHTML = `点赞: ${vlike}, 投币: ${vcoin}, 收藏: ${vfav}`;
    });
    coin_btn.addEventListener("click", function() {
      vcoin++;
      p_content.innerHTML = `点赞: ${vlike}, 投币: ${vcoin}, 收藏: ${vfav}`;
    });
    fav_btn.addEventListener("click", function() {
      vfav++;
      p_content.innerHTML = `点赞: ${vlike}, 投币: ${vcoin}, 收藏: ${vfav}`;
    });

    // 改颜色部分
    let vbox = document.getElementById("color_box");
    let vr = document.getElementById("input_r");
    let vg = document.getElementById("input_g");
    let vb = document.getElementById("input_b");
    document.getElementById("color_btn").addEventListener("click", function() {
      vbox.style.backgroundColor = `rgb(${vr.valueAsNumber}, ${vg.valueAsNumber}, ${vb.valueAsNumber})`
    });

    // 开关灯
    let light1 = false, light2 = false, light3 = false;
    function change_state(s1, s2, s3, close_color = "rgb(0, 0, 0)", open_color = "rgb(255, 255, 255)") {
      if (s1) {
        document.getElementById("box_1").style.backgroundColor = open_color;
      } else {
        document.getElementById("box_1").style.backgroundColor = close_color;
      }
      if (s2) {
        document.getElementById("box_2").style.backgroundColor = open_color;
      } else {
        document.getElementById("box_2").style.backgroundColor = close_color;
      }
      if (s3) {
        document.getElementById("box_3").style.backgroundColor = open_color;
      } else {
        document.getElementById("box_3").style.backgroundColor = close_color;
      }
    }
    
    document.getElementById("box_1").addEventListener("click", function() {
      light1 = !light1;
      light2 = !light2;
      change_state(light1, light2, light3);
    });
    document.getElementById("box_2").addEventListener("click", function() {
      light1 = !light1;
      light2 = !light2;
      light3 = !light3;
      change_state(light1, light2, light3);
    });
    document.getElementById("box_3").addEventListener("click", function() {
      light2 = !light2;
      light3 = !light3;
      change_state(light1, light2, light3);
    });

    // 康托展开与九个盒子
    function change_boxes(ord) {
      let arr = ord2per(9, ord);
      document.getElementById("per_text").innerHTML = "排列: " + arr.join(", ");
      document.getElementById("nine_boxes").innerHTML = `
        <div class = "num_box">${arr[0]}</div>
        <div class = "num_box">${arr[1]}</div>
        <div class = "num_box">${arr[2]}</div>
        <div class = "num_box">${arr[3]}</div>
        <div class = "num_box">${arr[4]}</div>
        <div class = "num_box">${arr[5]}</div>
        <div class = "num_box">${arr[6]}</div>
        <div class = "num_box">${arr[7]}</div>
        <div class = "num_box">${arr[8]}</div>
      `;
    }
    document.getElementById("ord2per_btn").addEventListener("click", function() {
      let ord = document.getElementById("ord2per_num").valueAsNumber;
      change_boxes(ord);
    });
    document.getElementById("rnd_per").addEventListener("click", function() {
      let rnd_number = Math.floor(362880 * Math.random());
      document.getElementById("ord2per_num").value = rnd_number;
      change_boxes(rnd_number);
    });
  </script>
  </body>
</html>
