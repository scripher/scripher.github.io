<!DOCTYPE html>

<html>
  <head>
    <meta charset = "UTF-8">
    <title>模拟搜索框</title>
    <link rel = "stylesheet" type = "text/css" href = "https://scripher.github.io/css/home_button.css">

    <link rel = "stylesheet" type = "text/css" href = "https://scripher.github.io/css/home_button.css">
    <script type = "module" src = "https://scripher.github.io/js/home_button.js"></script>
  </head>
  <body>
    <input id = "vinput" type = "text" style = "width: 1000px;" placeholder = "Input something here...">
    <button id = "baidu_btn">Baidu</button>
    <button id = "google_btn">Google</button>
    <button id = "bing_btn">Bing</button>
    <button id = "bili_btn">Bilibili</button>
    <button id = "zhihu_btn">Zhihu</button>

    <script>
      const ipt = document.getElementById("vinput");
      const baidu_btn = document.getElementById("baidu_btn");
      const google_btn = document.getElementById("google_btn");
      function web_search(web_name, search_txt) {
        if (web_name === "baidu") {
          window.location.href = "https://www.baidu.com/s?wd=" + search_txt;
        } else if (web_name === "google") {
          window.location.href = "https://www.google.com/search?q=" + search_txt;
        } else if (web_name == "bing") {
          window.location.href = "https://www.bing.com/search?q=" + search_txt;
        } else if (web_name === "bilibili") {
          window.location.href = "https://search.bilibili.com/all?keyword=" + search_txt;
        } else if (web_name == "zhihu") {
          window.location.href = "https://www.zhihu.com/search?type=content&q=" + search_txt;
        }
      }
      
      baidu_btn.addEventListener("click", function() {
        web_search("baidu", ipt.value);
      });
      google_btn.addEventListener("click", function() {
        web_search("google", ipt.value);
      });
      bing_btn.addEventListener("click", function() {
        web_search("bing", ipt.value);
      });
      bili_btn.addEventListener("click", function() {
        web_search("bilibili", ipt.value);
      });
      zhihu_btn.addEventListener("click", function() {
        web_search("zhihu", ipt.value);
      });
    </script>
  </body>
</html>
